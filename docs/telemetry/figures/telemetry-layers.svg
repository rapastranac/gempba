<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>The scheduler layer and the telemetry layer over the same ranks</title>
<desc>Four ranks. In the scheduler layer, on MPI_COMM_WORLD with the scheduler's own tags, rank 0 is the coordinator and ranks 1 to 3 are workers, linked by the scheduler's protocol of tasks, state and scores. Each rank's scheduler reports to its own telemetry hub with record calls and tick_if_due. In the telemetry layer, on a duplicated communicator with tags 9001 to 9004, every rank sends its frame to the aggregator on rank 0, which serves the dashboard over TCP on 127.0.0.1.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bg{fill:#FFFFFF}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-size:12px;fill:#5F5E5A}
.band{fill:none;stroke:#888780;stroke-width:0.8;stroke-dasharray:4 3}
.hook{fill:none;stroke:#5F5E5A;stroke-width:1.2;stroke-dasharray:3 3}
.tip{fill:none;stroke:#5F5E5A;stroke-width:1.5}
.proto{fill:none;stroke:#534AB7;stroke-width:1.4}
.bus{fill:none;stroke:#0F6E56;stroke-width:1.4}
.p rect,rect.p{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.5}
.p .th{fill:#3C3489}
.p .ts{fill:#534AB7}
.t rect,rect.t{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.5}
.t .th{fill:#085041}
.t .ts{fill:#0F6E56}
.n rect{fill:#F1EFE8;stroke:#888780;stroke-width:0.5}
@media (prefers-color-scheme: dark){
.bg{fill:#1F1F1D}
.th{fill:#F1EFE8}
.ts{fill:#B4B2A9}
.band{stroke:#888780}
.hook,.tip{stroke:#B4B2A9}
.proto{stroke:#AFA9EC}
.bus{stroke:#5DCAA5}
.p rect,rect.p{fill:#3C3489;stroke:#AFA9EC}
.p .th{fill:#EEEDFE}
.p .ts{fill:#CECBF6}
.t rect,rect.t{fill:#085041;stroke:#5DCAA5}
.t .th{fill:#E1F5EE}
.t .ts{fill:#9FE1CB}
.n rect{fill:#2C2C2A;stroke:#888780}
}
</style>
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="bus" d="M2 1L8 5L2 9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect class="bg" x="0" y="0" width="680" height="420" rx="12"/>

<rect class="band" x="16" y="16" width="648" height="116" rx="10"/>
<text class="th" x="32" y="44">Scheduler layer</text>
<text class="ts" x="32" y="64">MPI_COMM_WORLD</text>
<text class="ts" x="32" y="80">and its own tags</text>
<text class="ts" x="405" y="38" text-anchor="middle">tasks, state, scores</text>
<line class="proto" x1="225" y1="48" x2="585" y2="48"/>
<line class="proto" x1="225" y1="48" x2="225" y2="64"/>
<line class="proto" x1="345" y1="48" x2="345" y2="64"/>
<line class="proto" x1="465" y1="48" x2="465" y2="64"/>
<line class="proto" x1="585" y1="48" x2="585" y2="64"/>
<g class="p"><rect x="170" y="64" width="110" height="48" rx="6"/><text class="th" x="225" y="82" text-anchor="middle" dominant-baseline="central">Rank 0</text><text class="ts" x="225" y="100" text-anchor="middle" dominant-baseline="central">coordinator</text></g>
<g class="p"><rect x="290" y="64" width="110" height="48" rx="6"/><text class="th" x="345" y="82" text-anchor="middle" dominant-baseline="central">Rank 1</text><text class="ts" x="345" y="100" text-anchor="middle" dominant-baseline="central">worker</text></g>
<g class="p"><rect x="410" y="64" width="110" height="48" rx="6"/><text class="th" x="465" y="82" text-anchor="middle" dominant-baseline="central">Rank 2</text><text class="ts" x="465" y="100" text-anchor="middle" dominant-baseline="central">worker</text></g>
<g class="p"><rect x="530" y="64" width="110" height="48" rx="6"/><text class="th" x="585" y="82" text-anchor="middle" dominant-baseline="central">Rank 3</text><text class="ts" x="585" y="100" text-anchor="middle" dominant-baseline="central">worker</text></g>

<line class="hook" x1="225" y1="112" x2="225" y2="226" marker-end="url(#ah)"/>
<line class="hook" x1="345" y1="112" x2="345" y2="226" marker-end="url(#ah)"/>
<line class="hook" x1="465" y1="112" x2="465" y2="226" marker-end="url(#ah)"/>
<line class="hook" x1="585" y1="112" x2="585" y2="226" marker-end="url(#ah)"/>
<text class="ts" x="32" y="158">each rank calls</text>
<text class="ts" x="32" y="174">record_*() and</text>
<text class="ts" x="32" y="190">tick_if_due()</text>

<rect class="band" x="16" y="204" width="648" height="128" rx="10"/>
<text class="th" x="32" y="232">Telemetry layer</text>
<text class="ts" x="32" y="252">a duplicated</text>
<text class="ts" x="32" y="268">communicator,</text>
<text class="ts" x="32" y="284">tags 9001 to 9004</text>
<g class="t"><rect x="170" y="228" width="110" height="48" rx="6"/><text class="th" x="225" y="246" text-anchor="middle" dominant-baseline="central">Telemetry</text><text class="ts" x="225" y="264" text-anchor="middle" dominant-baseline="central">aggregator</text></g>
<g class="t"><rect x="290" y="228" width="110" height="48" rx="6"/><text class="th" x="345" y="246" text-anchor="middle" dominant-baseline="central">Telemetry</text><text class="ts" x="345" y="264" text-anchor="middle" dominant-baseline="central">sends its frame</text></g>
<g class="t"><rect x="410" y="228" width="110" height="48" rx="6"/><text class="th" x="465" y="246" text-anchor="middle" dominant-baseline="central">Telemetry</text><text class="ts" x="465" y="264" text-anchor="middle" dominant-baseline="central">sends its frame</text></g>
<g class="t"><rect x="530" y="228" width="110" height="48" rx="6"/><text class="th" x="585" y="246" text-anchor="middle" dominant-baseline="central">Telemetry</text><text class="ts" x="585" y="264" text-anchor="middle" dominant-baseline="central">sends its frame</text></g>
<line class="bus" x1="345" y1="276" x2="345" y2="300"/>
<line class="bus" x1="465" y1="276" x2="465" y2="300"/>
<path class="bus" d="M585 276 L585 300 L255 300 L255 280" marker-end="url(#at)"/>
<text class="ts" x="420" y="318" text-anchor="middle">rank frames</text>

<line class="bus" x1="195" y1="276" x2="195" y2="350" marker-end="url(#at)"/>
<g class="n"><rect x="32" y="354" width="190" height="48" rx="6"/><text class="th" x="127" y="372" text-anchor="middle" dominant-baseline="central">Dashboard</text><text class="ts" x="127" y="390" text-anchor="middle" dominant-baseline="central">TCP on 127.0.0.1</text></g>

<rect class="p" x="260" y="360" width="14" height="14" rx="3"/>
<text class="ts" x="282" y="367" dominant-baseline="central">the scheduler's protocol: yours to write</text>
<rect class="t" x="260" y="384" width="14" height="14" rx="3"/>
<text class="ts" x="282" y="391" dominant-baseline="central">telemetry: gempba's, the same for every scheduler</text>
</svg>
