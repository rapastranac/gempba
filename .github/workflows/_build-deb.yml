name: Build .deb (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc-14 g++-14 make libspdlog-dev libfmt-dev libhwloc-dev pkg-config

      - name: Configure (Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_BUILD_MPI=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # One package per install component: libgempba-dev, and libgempba-mpi-dev, which holds source only.
      - name: Package .deb
        run: |
          cd build && cpack -G DEB
          if dpkg-deb -c libgempba-mpi-dev_*.deb | awk '{print $6}' | grep -E '\.(so|a)(\.[0-9]+)*$'; then
            echo "::error::libgempba-mpi-dev holds compiled code"
            exit 1
          fi

      # Downstream consumers download with the `deb-package-*` glob.
      - name: Upload .deb as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-gempba
          path: build/*.deb
          retention-days: 7
