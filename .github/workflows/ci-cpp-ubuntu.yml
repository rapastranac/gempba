name: C/C++ CI (Ubuntu 24.04)

on:
  push:
    branches: [ "main", "release" ]
  # Docs-only PRs start no CI; wire-format.md still does, because a unit test reads it.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/telemetry/wire-format.md'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Set up environment and install dependencies
      - name: Setup Dependencies
        uses: ./.github/actions/setup-ubuntu-deps
        with:
          multiprocessing: 'ON'
          tests: 'true'

      # 3️⃣ Echo versions of installed dependencies
      - name: Echo Dependencies Version
        run: |
          echo "g++: $($CXX --version | head -1 | awk '{print $4}')"
          echo "cmake: $(cmake --version | head -1 | awk '{print $3}')"
          echo "make: $(make --version | head -1 | awk '{print $3}')"
          echo "libboost-dev: $(dpkg -s libboost-dev | grep 'Version' | awk '{print $2}')"
          echo "libhwloc-dev: $(dpkg -s libhwloc-dev | grep 'Version' | awk '{print $2}')"
          echo "libopenmpi-dev: $(dpkg -s libopenmpi-dev | grep 'Version' | awk '{print $2}')"
          echo "libgtest-dev: $(dpkg -s libgtest-dev | grep 'Version' | awk '{print $2}')"
          echo "libgmock-dev: $(dpkg -s libgmock-dev | grep 'Version' | awk '{print $2}')"

      # 4️⃣ Set up ccache. The MPI component's tests need it, so it is built too.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: build-ubuntu-mpON

      # 5️⃣ Configure + build with the MPI component
      - name: Configure + cached build
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DGEMPBA_BUILD_MPI=ON \
            -DGEMPBA_MPI_INTEGRATION_TESTS=ON \
            -DMPIEXEC_PREFLAGS=--oversubscribe \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          cmake --build build --parallel $(nproc)

      # 6️⃣ Run tests with JUnit XML output
      - name: Run tests
        run: |
          cd ${{ github.workspace }}/build

          ctest --output-on-failure --output-junit test_results_main.xml

      # 7️⃣ Upload coverage to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # 8️⃣ Upload test results as artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu
          path: ${{ github.workspace }}/build/test_results_*.xml
          retention-days: 30

      # 9️⃣ Publish test results as a check
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'build/test_results_*.xml'
          check_name: 'Ubuntu Test Results'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

  # Build the gempba-examples sister repo against an installed gempba built
  # from THIS branch. Mirror of gempba-examples' own CI job, except it
  # pulls gempba from this PR's commit rather than from a remote sister
  # branch. Both flavours build here, so an install-surface regression in
  # either mode fails this PR — not the next gempba-examples PR.
  build-examples-from-install:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    env:
      CC: gcc-14
      CXX: g++-14
      GEMPBA_EXAMPLES_OWNER: ${{ vars.GEMPBA_EXAMPLES_OWNER || github.repository_owner }}
      GEMPBA_INSTALL_PREFIX: ${{ github.workspace }}/.gempba-install
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      # 1️⃣ Checkout gempba (this PR's commit)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Install dependencies, MPI included for the MP=ON examples
      - name: Setup Dependencies
        uses: ./.github/actions/setup-ubuntu-deps
        with:
          multiprocessing: 'ON'
          tests: 'false'

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba-examples ref
        id: examples_ref
        uses: ./.github/actions/resolve-examples-ref
        with:
          examples-owner: ${{ env.GEMPBA_EXAMPLES_OWNER }}
          cross-repo-token: ${{ env.GEMPBA_CROSS_REPO_TOKEN }}

      # 4️⃣ Clone gempba-examples
      - name: Clone gempba-examples
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            EX_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          else
            EX_URL="https://github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.examples_ref.outputs.ref }}" \
            "$EX_URL" "$RUNNER_TEMP/gempba-examples-src"

      # 5️⃣ Install gempba, the core and the MPI component, into the prefix
      - name: Install gempba (the core and the MPI component)
        run: |
          cmake -S . -B "$RUNNER_TEMP/gempba-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_BUILD_MPI=ON
          cmake --build "$RUNNER_TEMP/gempba-build" --parallel $(nproc)
          cmake --install "$RUNNER_TEMP/gempba-build"

      # 6️⃣ Build the examples, the multithreading and the MPI ones, against it
      - name: Build gempba-examples
        run: |
          cmake -S "$RUNNER_TEMP/gempba-examples-src" -B "$RUNNER_TEMP/gempba-examples-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX"
          cmake --build "$RUNNER_TEMP/gempba-examples-build" --parallel $(nproc)

  # gempba installed without MPI, and a consumer that compiles gempba::mpi from the installed sources against MPICH,
  # run on 4 ranks in a clean Debian 13 container.
  mpich-consumer:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Build and run an MPICH consumer against the installed gempba
        run: bash scripts/test_mpich_consumer.sh

  # Packaging only on the way into main or release: PRs into them and pushes to them.
  build-deb:
    needs: test
    if: github.event_name == 'push' || contains(fromJSON('["main","release"]'), github.base_ref)
    uses: ./.github/workflows/_build-deb.yml

  build-apt-index:
    needs: build-deb
    uses: ./.github/workflows/_build-apt-index.yml
    secrets: inherit
