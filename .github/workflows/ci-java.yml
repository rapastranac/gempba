name: Java JNI binding

on:
  push:
    branches: [ "main", "release" ]
  # Docs-only PRs start no CI.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Shared with release-java.yml so tag-time publish reuses the same build path.
  # The macOS legs and the fat JARs run only on the way into main or release, and by hand.
  build:
    uses: ./.github/workflows/_build-java-jars.yml
    with:
      assemble: ${{ github.event_name != 'pull_request' || contains(fromJSON('["main","release"]'), github.base_ref) }}

  # The Maven Central bundle release-java.yml uploads, assembled from this run's Ubuntu JARs and signed with a throwaway
  # key, so a missing file shows up here rather than at release time. Nothing is uploaded.
  central-bundle:
    needs: [ build ]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Setup JDK 25
        uses: ./.github/actions/setup-java-jdk

      - name: Download the Ubuntu variant JARs
        uses: actions/download-artifact@v8
        with:
          pattern: jar-ubuntu-*
          merge-multiple: true
          path: jars/

      - name: Assemble and check the bundle with a throwaway key
        shell: bash
        run: |
          export GNUPGHOME=$(mktemp -d)
          gpg --batch --passphrase '' --quick-gen-key 'gempba CI <ci@invalid>' default default never
          bash scripts/central_bundle.sh jars central

  publish-test-results:
    needs: [ build ]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    if: ${{ !cancelled() }}

    steps:
      - name: Download all test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'TEST-*.xml'
          check_name: 'Java JNI Test Results'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true
