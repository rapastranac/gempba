name: C/C++ CI (Windows 2025)

on:
  push:
    branches: [ "main", "release" ]
  # Docs-only PRs start no CI; wire-format.md still does, because a unit test reads it.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/telemetry/wire-format.md'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER_WINDOWS || '["windows-2025"]') }}
    timeout-minutes: 30

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Set up MSYS2 + MS-MPI runtime (cache: false, release: false preserves
      # the preinstalled C:\msys64 on Server 2025 self-hosted runners — see #159).
      - name: Setup Dependencies
        uses: ./.github/actions/setup-windows-deps
        with:
          multiprocessing: 'ON'
          tests: 'true'
          cache: 'false'
          release: 'false'

      # 3️⃣ Echo versions of installed dependencies
      - name: Echo Dependencies Version
        shell: msys2 {0}
        run: |
          echo "g++: $(g++ --version | head -1 | awk '{print $NF}')"
          echo "cmake: $(cmake --version | head -1 | awk '{print $3}')"
          echo "make: $(make --version | head -1 | awk '{print $3}')"
          echo "mingw-w64-ucrt-x86_64-boost: $(pacman -Qi mingw-w64-ucrt-x86_64-boost | grep Version | awk '{print $3}')"
          echo "mingw-w64-ucrt-x86_64-hwloc: $(pacman -Qi mingw-w64-ucrt-x86_64-hwloc | grep Version | awk '{print $3}')"
          echo "mingw-w64-ucrt-x86_64-msmpi: $(pacman -Qi mingw-w64-ucrt-x86_64-msmpi | grep Version | awk '{print $3}')"
          echo "mingw-w64-ucrt-x86_64-gtest: $(pacman -Qi mingw-w64-ucrt-x86_64-gtest | grep Version | awk '{print $3}')"

      # 4️⃣ Configure + build with MP=ON. Tests reference gempba::mp::* directly,
      # so only MP=ON is built here.
      - name: Configure + build
        shell: msys2 {0}
        run: |
          cmake -G "MSYS Makefiles" -DGEMPBA_MULTIPROCESSING=ON -S . -B build
          cmake --build build --parallel $(nproc)

      # 5️⃣ Run tests with JUnit XML output
      - name: Run tests with retry for flaky tests
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/build"

          echo "🟢 Non-flaky tests: single run, must pass"
          ctest --output-on-failure --output-junit test_results_main.xml -E "FLAKY_"

          echo "🟡 Flaky tests: up to 3 attempts each"
          ctest --repeat until-pass:3 --output-on-failure --output-junit test_results_flaky.xml -R "FLAKY_" --no-tests=ignore

      # 6️⃣ Upload test results as artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows
          path: ${{ github.workspace }}/build/test_results_*.xml
          retention-days: 30

      # 7️⃣ Publish test results as a check
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'build/test_results_*.xml'
          check_name: 'Windows Test Results'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

  # Build the gempba-examples sister repo against an installed gempba built
  # from THIS branch. See ci-cpp-ubuntu.yml for rationale.
  build-examples-from-install:
    runs-on: ${{ fromJSON(vars.RUNNER_WINDOWS || '["windows-2025"]') }}
    timeout-minutes: 30
    env:
      GEMPBA_EXAMPLES_OWNER: ${{ vars.GEMPBA_EXAMPLES_OWNER || github.repository_owner }}
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      # 1️⃣ Checkout gempba (this PR's commit)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Set up MSYS2 + MS-MPI runtime, MPI included for the MP=ON examples;
      # `extra: git` so the cross-repo clone step has git available inside the msys2 shell.
      - name: Setup Dependencies
        uses: ./.github/actions/setup-windows-deps
        with:
          multiprocessing: 'ON'
          tests: 'false'
          extra: 'git'
          cache: 'false'
          release: 'false'

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba-examples ref
        id: examples_ref
        uses: ./.github/actions/resolve-examples-ref
        with:
          examples-owner: ${{ env.GEMPBA_EXAMPLES_OWNER }}
          cross-repo-token: ${{ env.GEMPBA_CROSS_REPO_TOKEN }}

      # 4️⃣ Clone gempba-examples
      - name: Clone gempba-examples
        shell: msys2 {0}
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            EX_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          else
            EX_URL="https://github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.examples_ref.outputs.ref }}" \
            "$EX_URL" "$RUNNER_TEMP/gempba-examples-src"

      # 5️⃣ Install gempba mt (the base package) into the prefix. The mpi
      #    topping package depends on the mt base for headers and the
      #    gempbaConfig.cmake dispatcher, so the mt install comes first.
      - name: Install gempba (mt base)
        shell: msys2 {0}
        run: |
          WS=$(cygpath -u "$GITHUB_WORKSPACE")
          GEMPBA_INSTALL_PREFIX="$WS/.gempba-install"
          echo "GEMPBA_INSTALL_PREFIX=$GEMPBA_INSTALL_PREFIX" >> "$GITHUB_ENV"
          cmake -G "MSYS Makefiles" \
            -S . -B "$RUNNER_TEMP/gempba-build-mt" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_DEV_MODE=OFF \
            -DGEMPBA_MULTIPROCESSING=OFF
          cmake --build "$RUNNER_TEMP/gempba-build-mt" --parallel $(nproc)
          cmake --install "$RUNNER_TEMP/gempba-build-mt"

      # 6️⃣ Build the examples against the mt base alone
      - name: Build gempba-examples (MP=OFF)
        shell: msys2 {0}
        run: |
          cmake -G "MSYS Makefiles" \
            -S "$RUNNER_TEMP/gempba-examples-src" -B "$RUNNER_TEMP/gempba-examples-build-mt" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_MULTIPROCESSING=OFF
          cmake --build "$RUNNER_TEMP/gempba-examples-build-mt" --parallel $(nproc)

      # 7️⃣ Layer the mpi topping on top of the mt base. Adds
      #    libgempba_mpi.a + gempba_mpi-targets.cmake so
      #    find_package(gempba COMPONENTS mpi) resolves.
      - name: Install gempba (mpi topping)
        shell: msys2 {0}
        run: |
          cmake -G "MSYS Makefiles" \
            -S . -B "$RUNNER_TEMP/gempba-build-mpi" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_DEV_MODE=OFF \
            -DGEMPBA_MULTIPROCESSING=ON
          cmake --build "$RUNNER_TEMP/gempba-build-mpi" --parallel $(nproc)
          cmake --install "$RUNNER_TEMP/gempba-build-mpi"

      # 8️⃣ Build the examples against the mt base plus the mpi topping
      - name: Build gempba-examples (MP=ON)
        shell: msys2 {0}
        run: |
          cmake -G "MSYS Makefiles" \
            -S "$RUNNER_TEMP/gempba-examples-src" -B "$RUNNER_TEMP/gempba-examples-build-mpi" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_MULTIPROCESSING=ON
          cmake --build "$RUNNER_TEMP/gempba-examples-build-mpi" --parallel $(nproc)

  # Packaging only on the way into main or release: PRs into them and pushes to them.
  build-msys2:
    needs: test
    if: github.event_name == 'push' || contains(fromJSON('["main","release"]'), github.base_ref)
    uses: ./.github/workflows/_build-msys2.yml
