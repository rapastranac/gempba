name: C/C++ CI (macOS 26)

on:
  push:
    branches: [ "main", "release" ]
  # Docs-only PRs start no CI; wire-format.md still does, because a unit test reads it.
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - 'docs/telemetry/wire-format.md'

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_INTEL || '["macos-26-intel"]') }}
    timeout-minutes: 30

    steps:
      - name: Clean stale .git locks from prior interrupted runs
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            find "$GITHUB_WORKSPACE/.git" -name '*.lock' -delete 2>/dev/null || true
          fi

      # 1️⃣ Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Bootstrap Homebrew on PATH + install brew packages
      - name: Setup Dependencies
        uses: ./.github/actions/setup-macos-deps
        with:
          multiprocessing: 'ON'
          tests: 'true'

      # 3️⃣ Echo versions of installed dependencies
      - name: Echo Dependencies Version
        run: |
          echo "g++: $(g++ --version | head -1)"
          echo "cmake: $(cmake --version | head -1 | awk '{print $3}')"
          echo "make: $(make --version | head -1 | awk '{print $3}')"
          echo "boost: $(brew info boost --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["versions"]["stable"])')"
          echo "hwloc: $(brew info hwloc --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["versions"]["stable"])')"
          echo "open-mpi: $(mpicc --showme:version 2>/dev/null || brew info open-mpi --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["versions"]["stable"])')"
          echo "googletest: $(brew info googletest --json | python3 -c 'import sys,json; print(json.load(sys.stdin)[0]["versions"]["stable"])')"

      # 4️⃣ Set up ccache. The MPI component's tests need it, so it is built too.
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: build-macos-mpON

      # 5️⃣ Configure + build with the MPI component
      - name: Configure + cached build
        run: |
          cmake -S . -B build \
            -DGEMPBA_BUILD_MPI=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_PREFIX_PATH=$(brew --prefix boost)
          cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      # 6️⃣ Run tests with JUnit XML output
      - name: Run tests
        run: |
          cd ${{ github.workspace }}/build

          ctest --output-on-failure --output-junit test_results_main.xml

      # 7️⃣ Upload test results as artifacts
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-macos
          path: ${{ github.workspace }}/build/test_results_*.xml
          retention-days: 30

      # 8️⃣ Publish test results as a check
      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'build/test_results_*.xml'
          check_name: 'macOS Test Results'
          fail_on_failure: true
          detailed_summary: true
          include_passed: true

  # Build the gempba-examples sister repo against an installed gempba built
  # from THIS branch. See ci-cpp-ubuntu.yml for rationale.
  build-examples-from-install:
    runs-on: ${{ fromJSON(vars.RUNNER_MACOS_INTEL || '["macos-26-intel"]') }}
    timeout-minutes: 30
    env:
      GEMPBA_EXAMPLES_OWNER: ${{ vars.GEMPBA_EXAMPLES_OWNER || github.repository_owner }}
      GEMPBA_INSTALL_PREFIX: ${{ github.workspace }}/.gempba-install
      GEMPBA_CROSS_REPO_TOKEN: ${{ secrets.GEMPBA_CROSS_REPO_TOKEN || '' }}

    steps:
      - name: Clean stale .git locks from prior interrupted runs
        shell: bash
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            find "$GITHUB_WORKSPACE/.git" -name '*.lock' -delete 2>/dev/null || true
          fi

      # 1️⃣ Checkout gempba (this PR's commit)
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      # 2️⃣ Install dependencies, MPI included for the MP=ON examples
      - name: Setup Dependencies
        uses: ./.github/actions/setup-macos-deps
        with:
          multiprocessing: 'ON'
          tests: 'false'

      # 3️⃣ Resolve sister-repo branch (same-name, fall back to main)
      - name: Resolve gempba-examples ref
        id: examples_ref
        uses: ./.github/actions/resolve-examples-ref
        with:
          examples-owner: ${{ env.GEMPBA_EXAMPLES_OWNER }}
          cross-repo-token: ${{ env.GEMPBA_CROSS_REPO_TOKEN }}

      # 4️⃣ Clone gempba-examples
      - name: Clone gempba-examples
        run: |
          if [ -n "$GEMPBA_CROSS_REPO_TOKEN" ]; then
            EX_URL="https://x-access-token:${GEMPBA_CROSS_REPO_TOKEN}@github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          else
            EX_URL="https://github.com/${GEMPBA_EXAMPLES_OWNER}/gempba-examples.git"
          fi
          git -c http."https://github.com/".extraheader= -c credential.helper= clone --depth 1 --branch "${{ steps.examples_ref.outputs.ref }}" \
            "$EX_URL" "$RUNNER_TEMP/gempba-examples-src"

      # 5️⃣ Install gempba, the core and the MPI component, into the prefix
      - name: Install gempba (the core and the MPI component)
        run: |
          cmake -S . -B "$RUNNER_TEMP/gempba-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GEMPBA_INSTALL_PREFIX" \
            -DGEMPBA_BUILD_TESTS=OFF \
            -DGEMPBA_BUILD_MPI=ON \
            -DCMAKE_PREFIX_PATH=$(brew --prefix boost)
          cmake --build "$RUNNER_TEMP/gempba-build" --parallel $(sysctl -n hw.logicalcpu)
          cmake --install "$RUNNER_TEMP/gempba-build"

      # 6️⃣ Build the examples, the multithreading and the MPI ones, against it
      - name: Build gempba-examples
        run: |
          cmake -S "$RUNNER_TEMP/gempba-examples-src" -B "$RUNNER_TEMP/gempba-examples-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$GEMPBA_INSTALL_PREFIX;$(brew --prefix boost)"
          cmake --build "$RUNNER_TEMP/gempba-examples-build" --parallel $(sysctl -n hw.logicalcpu)

