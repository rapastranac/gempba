name: Release Java JARs to Maven Central

# Uploads io.github.rapastranac:gempba and gempba-mpi to Maven Central as one deployment (#410). Central validates it,
# and a maintainer publishes it from https://central.sonatype.com/publishing/deployments, or drops it. Central never
# deletes a published version: to fix one, bump the pom version via prepare-release.yml and re-tag.
#
# Secrets: CENTRAL_TOKEN_USERNAME and CENTRAL_TOKEN_PASSWORD (a Central Portal user token), GPG_PRIVATE_KEY (an
# ASCII-armored secret key whose public key is on a keyserver Central checks) and GPG_PASSPHRASE.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

concurrency:
  group: release-java-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fresh build per tag — don't depend on a stale ci-java.yml artifact from a sibling run.
  build:
    uses: ./.github/workflows/_build-java-jars.yml

  publish-maven-central:
    needs: [ build ]
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 30
    env:
      CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
      CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

    steps:
      - name: Check the secrets are set
        shell: bash
        run: |
          missing=""
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing. See the comment at the top of release-java.yml."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Setup JDK 25
        uses: ./.github/actions/setup-java-jdk

      - name: Download merged multi-platform JARs
        uses: actions/download-artifact@v8
        with:
          name: gempba-multiplatform-jars
          path: jars/

      - name: Check the tag matches the POM version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # refs/tags/v4.1.0 → 4.1.0
          VERSION="${GITHUB_REF##*/v}"
          source scripts/_java_artifact.sh
          POM_VERSION=$(gempba_java_version "$GITHUB_WORKSPACE")
          if [ "$VERSION" != "$POM_VERSION" ]; then
            echo "::error::Tag version $VERSION differs from bindings/java/pom.xml's $POM_VERSION"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Import the signing key
        shell: bash
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Assemble, sign and check the bundle
        shell: bash
        run: bash scripts/central_bundle.sh jars central

      # USER_MANAGED: Central validates the deployment and waits for a maintainer to publish it.
      - name: Upload the bundle to Maven Central
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          VERSION=${{ steps.meta.outputs.version }}
          AUTH=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          DEPLOYMENT=$(curl -fsS -X POST \
            -H "Authorization: Bearer ${AUTH}" \
            --form "bundle=@central/gempba-${VERSION}-central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=gempba-${VERSION}&publishingType=USER_MANAGED")
          echo "Deployment ${DEPLOYMENT}"
          echo "deployment=${DEPLOYMENT}" >> "$GITHUB_OUTPUT"

      - name: Wait for Central to validate the deployment
        shell: bash
        run: |
          set -euo pipefail
          AUTH=$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)
          for attempt in $(seq 1 40); do
            STATUS=$(curl -fsS -X POST -H "Authorization: Bearer ${AUTH}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${{ steps.upload.outputs.deployment }}")
            STATE=$(printf '%s' "$STATUS" | grep -oE '"deploymentState" *: *"[A-Z_]+"' | grep -oE '[A-Z_]+"$' | tr -d '"')
            echo "Attempt ${attempt}: ${STATE}"
            case "$STATE" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "::notice::Validated. Publish it, or drop it, at https://central.sonatype.com/publishing/deployments"
                exit 0
                ;;
              FAILED)
                echo "::error::Central rejected the deployment"
                printf '%s\n' "$STATUS"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "::error::Central hadn't validated the deployment after 10 minutes; check it in the Portal"
          exit 1
